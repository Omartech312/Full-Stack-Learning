<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS: JavaScript Basics</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="../../CSS/images/favicon.ico" type="image/x-icon">
    <!-- imports the javascript, but defer waits for HTML to load before pulling JS-->
    <script src="script.js" defer></script>
</head>
<body>
    <h1>JavaScript Basics</h1>
    <div id="variables">
        <h2>Variables</h2>
        <p id="p1"></p>
        <p id="p2"></p>
        <p id="p3"></p>
        <hr>
    </div>

    <div id="Arithmetic">
        <h2>Arithmetic</h2>
        <p> The product of 35 + 7 * 3 - 1 % 5 is <span id="answer"></span></p>
        <hr>
    </div>

    <div>
        <h2>Accepting user input in JS</h2>
        <label>Enter your username: </label>
        <input id="userInput"><br><br>
        <button id="mySubmit">submit</button><br>
        <h3 id="welcome"></h3>
        <hr>
    </div>

    <div>
        <h2>Type Conversion</h2>
        <p>Please provide a number from 1 to 100. number 1 will be added to this value to show the difference between adding to a String and Number.</p>
        <label>Enter a number (1-100): </label>
        <input id="numConversion"><br><br>
        <button id="typeSubmit">submit</button><br>

        <h3 id="strOutput"></h3>
        <h3 id="intOutput"></h3>
        <h3 id="explain"></h3>
        <hr>
    </div>


    <div>
        <h2>Constants</h2>
        <label></label>
    </div>

    <div style="position: fixed; right: 1vw; top: 0px;"><h3><a href="../../home.html"> Return To Homepage</a></h3></div>
</body>
</html>
