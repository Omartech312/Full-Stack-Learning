    <h1>Modules and Error Handling</h1>

    <p>This section will calculate the circumference and area of a circle and the volume of a sphere based on your desired radius</p>
    <label for="modules">Provide Radius:</label>
    <input id="modules" type="number"/>
    <button id="modulesButton">Submit</button>

    <label for="dividend">Please provide a dividend: </label>
    <input type="text" id="dividend"/><br>

    <button id="errorButton">Calculate</button>

    <p class="altoutput" id="divOut"></p>
