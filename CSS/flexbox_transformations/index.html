<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Learning: Flexbox, Transformations, and Animations</title>
    <link rel="stylesheet" href="styles.css"/>
    <link rel="icon" href="../images/favicon.ico" type="image/x-icon" />
</head>

<body>
    <h1><abbr title="Cascading Style Sheets">CSS:</abbr> <strong>Flexbox, Transformations, and Animations</strong></h1>

    <div class="container">
        <div class="box" id="box1"><span>1</span></div>
        <div class="box" id="box2"><span>2</span></div>
        <div class="box" id="box3"><span>3</span></div>
        <div class="box" id="box4"><span>4</span></div>
        <div class="box" id="box5">
            <span>5</span>
            <img src="../images/instant.png" alt="instant transmission" height="0%" width="0%">
        </div>
        <div class="box" id="box6"><span>6</span></div>
        <div class="box" id="box7"><span>7</span></div>
        <div class="box" id="box8"><span>8</span></div>
    </div>
    
</body>


</html>
